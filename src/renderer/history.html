<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Dayfold · 记录历史</title>
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <header class="header">
    <h1>记录历史</h1>
    <div class="view-tabs">
      <button class="view-tab active" data-view="day">按天查看</button>
      <button class="view-tab" data-view="week">周报</button>
    </div>
    <div class="date-nav" id="date-nav"></div>
  </header>

  <main id="day-view" class="day-view"></main>

  <script src="history.js"></script>
</body>
</html>
